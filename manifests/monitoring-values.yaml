# Reference values reconstructed from the verified lab discussion.
# IMPORTANT: Compare with:
#   helm get values monitoring -n monitoring -o yaml
# before treating these as an exact export of the live release.
# Chart: prometheus-community/kube-prometheus-stack --version 93.3.0
# These values do not create the EKS cluster or IAM Pod Identity roles.

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    retention: 3d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 150m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-monitoring
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true
  service:
    type: ClusterIP
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3-monitoring
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-monitoring
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
