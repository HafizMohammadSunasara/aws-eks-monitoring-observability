# Observed StorageClass, reproduced for documentation and deliberate reuse.
# Warning: reclaimPolicy Delete removes the EBS volume when its PV is deleted.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-monitoring
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  csi.storage.k8s.io/fstype: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
