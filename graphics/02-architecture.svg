  <text x="26" y="37" class="small" fill="#FFB19A">AWS ADD-ON</text>
  <text x="26" y="83" class="node" fill="#FFFFFF">CloudWatch agent</text>
  <text x="26" y="118" class="sub" fill="#FFCAB8">CloudWatch Observability</text>
 </g>
 <g transform="translate(989 318)">
  <rect width="365" height="151" rx="17" fill="#FF5722"/>
