 <path d="M873 132H973" stroke="#304CFF" stroke-width="7" fill="none" marker-end="url(#blue)"/>
 <path d="M873 195H925V222H972" stroke="#C8F542" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#blue)"/>
