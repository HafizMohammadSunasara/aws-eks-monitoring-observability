 <text x="31" y="30" class="tag" fill="#111418">PERSISTENCE LAYER</text>
 <text x="31" y="59" class="sub" fill="#374146">gp3-monitoring · encrypted EBS volumes · 10Gi Prometheus + 5Gi Grafana + 2Gi Alertmanager</text>
 <text x="1179" y="47" class="small" fill="#304CFF">17Gi TOTAL</text>
</g>
