<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Separate telemetry streams: Prometheus metrics and CloudWatch logs</title><desc id="desc">A flight recorder inspired telemetry comparison of two independent observability paths.</desc>
<defs>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#344048" stroke-width="1" fill="none"/></pattern>
 <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#304CFF"/></marker>
 <marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#FF5722"/></marker>
 <style>.h{font:900 68px 'DejaVu Sans',Arial,sans-serif;letter-spacing:-3px}.mono{font:700 17px 'Liberation Mono',monospace;letter-spacing:1px}.title{font:800 30px 'Liberation Sans',Arial,sans-serif}.body{font:400 21px 'Liberation Sans',Arial,sans-serif}.micro{font:700 14px 'Liberation Sans',Arial,sans-serif;letter-spacing:2.2px}</style>
</defs>
<rect width="1600" height="900" fill="#F1EDE3"/>
<rect x="0" y="0" width="1600" height="11" fill="#FF5722"/>
<text x="78" y="70" class="mono" fill="#304CFF">BLACK BOX / TRACE ANALYSIS / 03</text>
<text x="73" y="152" class="h" fill="#111418">FOLLOW THE SIGNAL.</text>
<text x="78" y="200" class="body" fill="#5E6868">Two pipelines. Different questions. Complementary evidence.</text>
<rect x="78" y="236" width="1444" height="542" rx="25" fill="#111418"/>
<rect x="105" y="262" width="1390" height="489" rx="10" fill="url(#grid)"/>
<g transform="translate(137 311)">
 <rect width="1320" height="166" rx="18" fill="#1D262C" stroke="#445362" stroke-width="2"/>
 <rect width="14" height="166" rx="6" fill="#304CFF"/>
 <text x="35" y="38" class="micro" fill="#AAB8FF">CHANNEL 01   /   PULL-BASED METRICS</text>
 <text x="35" y="78" class="title" fill="#F1EDE3">Kubernetes exporters</text>
 <path d="M336 99H426" stroke="#304CFF" stroke-width="5" marker-end="url(#b)"/>
 <rect x="438" y="52" width="239" height="78" rx="12" fill="#304CFF"/>
 <text x="460" y="96" class="title" fill="white" style="font-size:27px">Prometheus</text>
 <path d="M677 99H776" stroke="#304CFF" stroke-width="5" marker-end="url(#b)"/>
 <rect x="789" y="52" width="196" height="78" rx="12" fill="#F1EDE3"/>
 <text x="809" y="99" class="title" fill="#111418" style="font-size:27px">Grafana</text>
 <path d="M557 52V44H1180V51" stroke="#C8F542" stroke-width="4" fill="none" stroke-dasharray="10 6"/>
 <rect x="1070" y="52" width="220" height="78" rx="12" fill="none" stroke="#C8F542" stroke-width="2"/>
 <text x="1090" y="100" class="title" fill="#C8F542" style="font-size:24px">Alertmanager</text>
 <text x="36" y="147" class="micro" fill="#91A0AA">CPU · MEMORY · NODE · POD · NETWORK · ALERTING</text>
</g>
<g transform="translate(137 514)">
 <rect width="1320" height="166" rx="18" fill="#2D211E" stroke="#764636" stroke-width="2"/>
 <rect width="14" height="166" rx="6" fill="#FF5722"/>
 <text x="35" y="38" class="micro" fill="#FFB8A0">CHANNEL 02   /   AGENT-BASED TELEMETRY</text>
 <text x="35" y="88" class="title" fill="#F1EDE3">Container / node logs</text>
 <path d="M350 99H454" stroke="#FF5722" stroke-width="5" marker-end="url(#o)"/>
 <rect x="468" y="52" width="313" height="78" rx="12" fill="#5D3427" stroke="#FF5722" stroke-width="2"/>
 <text x="492" y="84" class="title" fill="#F1EDE3" style="font-size:24px">CloudWatch</text>
 <text x="492" y="111" class="body" fill="#FFB8A0" style="font-size:17px">Observability agent</text>
 <path d="M781 99H863" stroke="#FF5722" stroke-width="5" marker-end="url(#o)"/>
 <rect x="876" y="52" width="414" height="78" rx="12" fill="#FF5722"/>
 <text x="900" y="88" class="title" fill="white" style="font-size:24px">Amazon CloudWatch</text>
 <text x="900" y="113" class="body" fill="white" style="font-size:17px">Logs + Container Insights</text>
 <text x="36" y="147" class="micro" fill="#D5A18F">LOG STREAMS · PERFORMANCE · CLOUD CONSOLE</text>
</g>
<g transform="translate(137 706)">
 <circle cx="10" cy="9" r="8" fill="#C8F542"/>
 <text x="30" y="15" class="micro" fill="#C8F542">SEPARATE DESTINATIONS — NO CLOUDWATCH / PROMETHEUS DATASOURCE LINK CLAIMED.</text>
</g>
<g transform="translate(78 811)">
 <rect width="1444" height="59" rx="11" fill="#DADBD0"/>
 <text x="23" y="38" class="mono" fill="#111418">PROMETHEUS = time-series / K8s health</text>
 <text x="814" y="38" class="mono" fill="#111418">CLOUDWATCH = AWS telemetry / logs</text>
</g>
</svg>
