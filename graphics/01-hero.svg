<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The Cloud's Black Box — AWS EKS Monitoring and Observability</title>
<desc id="desc">Original editorial technical illustration with a flight-data recorder, isolated telemetry rings and project title. Conceptual art, not a screenshot.</desc>
<defs>
  <pattern id="paper" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#C7C8C5" stroke-opacity=".35" stroke-width="1"/><circle cx="0" cy="0" r="1" fill="#B4B4AD"/></pattern>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#CBD0C7"/></pattern>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30363A"/><stop offset=".55" stop-color="#161B1E"/><stop offset="1" stop-color="#07090B"/></linearGradient>
  <linearGradient id="display" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14273F"/><stop offset="1" stop-color="#111418"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="20" dy="28" stdDeviation="20" flood-color="#39464E" flood-opacity=".24"/></filter>
  <style>
  .ink{fill:#111418}.muted{fill:#626A6C}.orange{fill:#FF5722}.blue{fill:#304CFF}.lime{fill:#C8F542}
  .eyebrow{font:700 17px 'Liberation Sans',Arial,sans-serif;letter-spacing:5px}
  .mega{font:900 118px 'DejaVu Sans','Liberation Sans',Arial,sans-serif;letter-spacing:-7.5px}
  .micro{font:700 15px 'Liberation Sans',Arial,sans-serif;letter-spacing:2.4px}
  .label{font:700 23px 'Liberation Sans',Arial,sans-serif;letter-spacing:.2px}
  </style>
</defs>
