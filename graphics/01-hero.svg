<g transform="translate(86 244)">
 <text x="0" y="0" class="eyebrow blue">OBSERVE THE SYSTEM. NOT THE GUESS.</text>
 <text x="-8" y="150" class="mega ink">THE CLOUD'S</text>
 <text x="-8" y="292" class="mega ink">BLACK BOX<tspan fill="#FF5722">.</tspan></text>
 <rect x="0" y="324" width="158" height="7" fill="#FF5722"/>
 <text x="0" y="381" class="label ink">Every system leaves a signal.</text>
 <text x="0" y="420" style="font:400 23px 'Liberation Sans',Arial,sans-serif;fill:#626A6C">A forensic record of metrics, storage,</text>
 <text x="0" y="450" style="font:400 23px 'Liberation Sans',Arial,sans-serif;fill:#626A6C">dashboards and alerts on Amazon EKS.</text>
</g>
